name: RaceDay API CI

on:
  push:
    branches:
      - part2-api
  pull_request:
    branches:
      - part2-api

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.csproj

      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release